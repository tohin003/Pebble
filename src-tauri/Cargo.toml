[package]
name = "pebble"
version = "1.3.0"
description = "Your local engineering companion"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSBundle", "NSDictionary", "NSArray", "NSSet"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
codegen-units = 1
lto = false
strip = true
opt-level = "s"
