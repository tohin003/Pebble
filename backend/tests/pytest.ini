[pytest]
# V1-131 (Phase 24). This file sits beside the tests, so the rootdir and the test IDs stay what they were.
# No .pytest_cache in the checkout; a passed test's tmp_path folder is deleted (a failed one is kept as evidence);
# a test still running after 15 minutes dumps every thread's stack.
addopts = -p no:cacheprovider
tmp_path_retention_policy = failed
faulthandler_timeout = 900
